name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.32.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VERSION"

      - name: Validate Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi
          echo "Version match confirmed: $CARGO_VERSION"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

      - name: Run release-mode tests
        run: cargo test --release --all-features

      - name: Build release
        run: cargo build --release --all-features

      - name: Strip binaries
        run: strip target/release/vigil target/release/vigild

      - name: Prepare release assets
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGING="vigil-baseline-${VERSION}-linux-x86_64"
          mkdir -p "$STAGING"
          cp target/release/vigil "$STAGING/"
          cp target/release/vigild "$STAGING/"
          cp README.md LICENSE "$STAGING/"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Extract the "## [VERSION]" Keep-a-Changelog section the project
          # actually uses. index() matches the heading literally so dots in
          # the version are not treated as regex wildcards; print until the
          # next "## [" heading.
          awk -v hdr="## [${VERSION}]" 'index($0, hdr) == 1 { grab = 1; next } grab && /^## \[/ { exit } grab { print }' CHANGELOG.md > /tmp/changelog.txt
          # Fail loud: never ship a tagged release with empty notes by
          # silently falling back to a raw git log. A missing section means
          # CHANGELOG.md was not updated before tagging.
          if [ ! -s /tmp/changelog.txt ]; then
            echo "::error::No '## [${VERSION}]' section found in CHANGELOG.md for tag ${TAG}. Add the changelog section before tagging; refusing to publish a release with empty notes."
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: vigil-baseline-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish must fail loudly. Previously `continue-on-error: true`
          # let a failed crates.io upload still mint a "successful" GitHub
          # Release, provenance attestation, and SBOM. The only tolerated
          # failure is an idempotent re-run of a tag whose version is
          # already on crates.io (duplicate uploads are rejected); that is
          # treated as success. Every other failure is fatal.
          set +e
          OUTPUT=$(cargo publish --locked 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "Published to crates.io."
            exit 0
          fi
          if echo "$OUTPUT" | grep -qiE 'already (uploaded|exists)|crate version .* is already'; then
            echo "::notice::This version is already on crates.io; treating as success (idempotent re-run)."
            exit 0
          fi
          echo "::error::cargo publish failed (exit ${STATUS}); see log above."
          exit "$STATUS"

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename release-sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Vigil Baseline ${{ steps.version.outputs.tag }}
          body_path: /tmp/changelog.txt
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            vigil-baseline-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            vigil-baseline-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz.sha256
            release-sbom*.json
